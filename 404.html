<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Page Not Found · CGPA/P</title>
<meta name="robots" content="noindex, follow">
<style>
  :root {
    --bg: #f4efe6;
    --ink: #1a1a1a;
    --green: #1e4d3a;
    --accent: #c44a2c;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    background: var(--bg);
    color: var(--ink);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 2rem;
    text-align: center;
  }
  .wrap { max-width: 36rem; }
  .code {
    font-size: clamp(4rem, 12vw, 8rem);
    font-weight: 700;
    color: var(--green);
    line-height: 1;
    letter-spacing: -0.02em;
  }
  .code em {
    color: var(--accent);
    font-style: italic;
    font-family: Georgia, 'Times New Roman', serif;
  }
  h1 {
    font-family: Georgia, 'Times New Roman', serif;
    font-size: clamp(1.5rem, 4vw, 2.25rem);
    font-weight: 400;
    margin: 1.5rem 0 0.75rem;
    color: var(--ink);
  }
  p { font-size: 0.95rem; color: #555; margin-bottom: 2rem; line-height: 1.6; }
  .actions { display: flex; gap: 0.75rem; justify-content: center; flex-wrap: wrap; }
  a.btn {
    display: inline-block;
    padding: 0.75rem 1.5rem;
    border-radius: 999px;
    text-decoration: none;
    font-weight: 600;
    font-size: 0.875rem;
    transition: transform 0.15s ease, background 0.15s ease;
  }
  a.primary { background: var(--green); color: var(--bg); }
  a.secondary { background: transparent; color: var(--ink); border: 1px solid var(--ink); }
  a.btn:hover { transform: translateY(-1px); }
</style>
</head>
<body>
  <div class="wrap">
    <div class="code">4<em>0</em>4</div>
    <h1>This page wandered off.</h1>
    <p>The page you’re looking for doesn’t exist, or it has moved to a cleaner URL.</p>
    <div class="actions">
      <a class="btn primary" href="/">Go to homepage</a>
      <a class="btn secondary" href="/blog/">Read the blog</a>
    </div>
  </div>
</body>
</html>
